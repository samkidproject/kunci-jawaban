<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kunci Jawaban Ujian Arsiparis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col justify-between">

    <header class="bg-indigo-600 text-white shadow-sm sticky top-0 z-10">
        <div class="max-w-md mx-auto px-4 py-3.5 text-center">
            <h1 class="text-sm font-bold tracking-tight">Kunci Jawaban Ujian Arsiparis</h1>
            <p class="text-indigo-200 text-[11px] mt-0.5">Ketik soal untuk melihat jawaban benar secara instan</p>
        </div>
    </header>

    <main class="max-w-md w-full mx-auto px-4 py-4 flex-grow">
        <!-- Search Input Box -->
        <div class="relative mb-4">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Ketik soal ujian di sini..." 
                class="w-full pl-11 pr-10 py-3 bg-white border border-slate-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-800 text-sm transition-all"
                autocomplete="off"
                autofocus
            >
            <button id="clearBtn" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 hidden">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Initial instruction state -->
        <div id="initialState" class="text-center py-10 px-4">
            <div class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-indigo-50 text-indigo-500 mb-2.5">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <h2 class="text-slate-700 font-medium text-xs">Mulai mengetik untuk mencari kunci jawaban</h2>
            <p class="text-slate-400 text-[11px] mt-0.5">Jawaban benar akan muncul otomatis</p>
        </div>

        <!-- Results List Container -->
        <div id="resultsContainer" class="space-y-3">
            <!-- Dynamic answer cards will appear here -->
        </div>

        <!-- Empty / No match state -->
        <div id="emptyState" class="hidden text-center py-8 px-4 bg-white rounded-xl border border-dashed border-slate-300">
            <h3 class="text-slate-700 font-medium text-xs">Soal tidak ditemukan</h3>
            <p class="text-slate-400 text-[11px] mt-0.5">Pastikan ejaan kata sesuai dengan naskah soal.</p>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-2.5 text-center text-[10px] text-slate-400">
        <p>Aplikasi Kunci Jawaban Arsiparis &bull; Mobile Optimized</p>
    </footer>

    <script>
        // Complete 45 dataset compiled from official document
        const qaData = [
            {
                id: 1,
                question: "Kebijakan alih media arsip meliputi beberapa metode, yaitu ....",
                answerText: "B: pengkopian, konversi, migrasi"
            },
            {
                id: 2,
                question: "Pemeliharaan arsip dinamis dilakukan melalui kegiatan ....",
                answerText: "A: pemberkasan arsip aktif, penataan arsip inaktif, penyimpanan dan alih media arsip"
            },
            {
                id: 3,
                question: "Arsip negara yang berkaitan dengan keberadaan dan kelangsungan hidup bangsa dan negara yang harus dijaga keutuhan, keamanan, dan keselamatannya merupakan arsip ....",
                answerText: "B: arsip terjaga"
            },
            {
                id: 4,
                question: "Berikut ini merupakan informasi yang paling banyak dimuat dalam daftar isi berkas, kecuali ....",
                answerText: "D: retensi"
            },
            {
                id: 5,
                question: "Cara-cara meningkatkan layanan unit kearsipan sebagai berikut, kecuali …",
                answerText: "B: menerapkan legislasi yang komprehensif untuk mengatur siklus"
            },
            {
                id: 6,
                question: "Berikut ini salah satu contoh arsip vital instansi pemerintah pusat dan daerah adalah ....",
                answerText: "B: perjanjian kerja sama strategis"
            },
            {
                id: 7,
                question: "Pemindaian arsip asli direkomendasikan untuk menggunakan resolusi minimum, yaitu ....",
                answerText: "C: 300 dpi"
            },
            {
                id: 8,
                question: "Pengelolaan dan penataan arsip inaktif dilakukan berdasarkan ....",
                answerText: "C: asas asal usul dan asas aturan asli"
            },
            {
                id: 9,
                question: "Dalam kegiatan alih media kertas ke elektronik (digitalisasi), pemindaian dapat dilakukan dengan ....",
                answerText: "A: alat pemindai"
            },
            {
                id: 10,
                question: "Kriteria arsip yang bernilai guna kebuktian (evidential) adalah ....",
                answerText: "A: merupakan bukti dan informasi tentang kegiatan pokok organisasi"
            },
            {
                id: 11,
                question: "Pengertian Arsip Inaktif adalah ....",
                answerText: "A: arsip yang frekuensi penggunaannya telah menurun"
            },
            {
                id: 12,
                question: "Daftar arsip inaktif yang dipindahkan terdiri dari ….",
                answerText: "C: daftar berkas dan daftar isi berkas"
            },
            {
                id: 13,
                question: "Di bawah ini yang Bukan merupakan tahapan dalam prosedur pelaksanaan alih media arsip adalah ....",
                answerText: "A: memusnahkan arsip kertas yang telah dialih media"
            },
            {
                id: 14,
                question: "Terhadap arsip statis yang dinyatakan tertutup, Kepala ANRI atau Pimpinan Lembaga Kearsipan sesuai lingkup kewenangannya dapat menyatakan arsip statis tersebut menjadi terbuka setelah melewati masa penyimpanan selama ....",
                answerText: "B: 25 tahun"
            },
            {
                id: 15,
                question: "Pada penyusunan daftar arsip statis, kegiatan menggambarkan unit informasi arsip yang dapat mengacu pada standar yang berlaku secara nasional dan internasional disebut …. ",
                answerText: "C: deskripsi arsip statis"
            },
            {
                id: 16,
                question: "Berikut ini ketahanan fisik media yang harus diperhatikan pada teknis penyimpanan arsip statis, kecuali ....",
                answerText: "D: penataan arsip"
            },
            {
                id: 17,
                question: "Metode perbaikan arsip melalui proses mekanik dilakukan dengan menggunakan suspensi bubur kertas/pulp dalam air yang diisap melalui screen sebagai penyangga lembaran kertas sehingga bagian yang hilang dari lembaran kertas dapat diisi dengan serat selulosa, disebut ....",
                answerText: "D: leafcasting"
            },
            {
                id: 18,
                question: "Berikut prosedur penyusunan inventaris arsip statis, kecuali ....",
                answerText: "B: pemberian tunjuk silang"
            },
            {
                id: 19,
                question: "Jenis sarana bantu penemuan kembali arsip statis yang dibuat oleh lembaga kearsipan yang memuat daftar arsip statis dan disusun secara sistematis sesuai dengan pencipta arsip serta sekurang-kurangnya memuat indeks, struktur organisasi pencipta, dan riwayat hidup arsip, adalah ....",
                answerText: "C: inventaris arsip statis"
            },
            {
                id: 20,
                question: "Di bawah ini adalah kegiatan perencanaan menghadapi bencana (disaster planning), kecuali ....",
                answerText: "B: perawatan"
            },
            {
                id: 21,
                question: "Berikut ini merupakan kegiatan pengelolaan arsip statis, kecuali …. ",
                answerText: "A: penilaian arsip"
            },
            {
                id: 22,
                question: "Kegiatan yang dilakukan untuk mengetahui kondisi arsip yang disimpan agar dapat dipetakan kegiatan preservasinya adalah ....",
                answerText: "A: risk assessment"
            },
            {
                id: 23,
                question: "Sarana bantu penemuan arsip statis berupa uraian deskripsi informasi yang sekurang-kurangnya memuat nomor arsip, bentuk redaksi, isi ringkas, kurun waktu penciptaan, tingkat perkembangan, jumlah, dan kondisi arsip disebut ….",
                answerText: "D: daftar arsip statis"
            },
            {
                id: 24,
                question: "Berikut ini sarana penemuan arsip statis berupa susunan hasil deskripsi unit informasi arsip suatu kelompok/grup arsip secara menyeluruh, adalah ....",
                answerText: "D: inventaris arsip"
            },
            {
                id: 25,
                question: "Berikut ini ketahanan fisik media yang harus diperhatikan pada teknis penyimpanan arsip statis, kecuali ....",
                answerText: "D: penataan arsip"
            },
            {
                id: 26,
                question: "Di bawah ini, yang bukan menjadi persyaratan Arsiparis untuk naik jabatan setingkat lebih tinggi adalah ....",
                answerText: "B: kualifikasi pendidikan"
            },
            {
                id: 27,
                question: "Kegiatan uji kompetensi atau sertifikasi Jabatan Fungsional Arsiparis dilakukan dengan mengacu kepada ....",
                answerText: "D: standar kompetensi jabatan fungsional arsiparis"
            },
            {
                id: 28,
                question: "Pembinaan kearsipan terhadap pencipta arsip di lingkungan daerah Kabupaten/Kota adalah ....",
                answerText: "C: Perguruan Tinggi Negeri"
            },
            {
                id: 29,
                question: "Kegiatan dalam menilai kesesuaian antara prinsip, kaidah, dan standar kearsipan dengan penyelenggaraan kearsipan, adalah ....",
                answerText: "A: pengawasan kearsipan"
            },
            {
                id: 30,
                question: "Kegiatan pembinaan kearsipan oleh Arsiparis Penyelia adalah ....",
                answerText: "D: melakukan penilaian kinerja arsiparis terampil dan arsiparis mahir"
            },
            {
                id: 31,
                question: "Penilaian kinerja arsiparis merupakan tugas pokok bagi arsiparis dalam melakukan kegiatan ....",
                answerText: "A: pembinaan kearsipan"
            },
            {
                id: 32,
                question: "Pembinaan internal dalam pengelolaan arsip di lingkungan pencipta arsip merupakan tanggung jawab ....",
                answerText: "C: Unit Kearsipan"
            },
            {
                id: 33,
                question: "Peraturan Kepala Arsip Nasional Republik Indonesia tentang Pedoman Penilaian Prestasi Kerja Jabatan Fungsional Arsiparis adalah ....",
                answerText: "B: nomor 5 Tahun 2017"
            },
            {
                id: 34,
                question: "Berikut ini yang bukan merupakan materi kegiatan Bimbingan Teknis (BINTEK) Pengelolaan Arsip Vital adalah ....",
                answerText: "A: pengelolaan arsip perbatasan"
            },
            {
                id: 35,
                question: "Aplikasi yang memuat tentang pengelolaan arsip dinamis yang digunakan dengan mekanisme bagi pakai antar instansi pemerintah disebut dengan ....",
                answerText: "D: SRIKANDI"
            },
            {
                id: 36,
                question: "Hasil kerja melakukan penilaian prestasi kerja arsiparis, adalah ….",
                answerText: "A: verifikasi penilaian prestasi kerja arsiparis"
            },
            {
                id: 37,
                question: "Melakukan bimbingan teknis (BINTEK) kearsipan termasuk ke dalam tugas pokok arsiparis pada kegiatan ....",
                answerText: "C: pembinaan kearsipan"
            },
            {
                id: 38,
                question: "Persiapan pelaksanaan Bimbingan Teknis sebagai berikut, kecuali …. ",
                answerText: "C: pembuatan inventaris bimbingan teknis"
            },
            {
                id: 39,
                question: "Kegiatan pelatihan atau pembelajaran yang ditujukan untuk memperdalam pengetahuan dan keterampilan dalam pengelolaan arsip disebut ….  ",
                answerText: "B: bimbingan teknis kearsipan"
            },
            {
                id: 40,
                question: "Sasaran pemberikan Bimbingan Teknis (BINTEK) pengelolaan arsip statis yang kurang tepat yaitu ...",
                answerText: "A: Arsiparis di Unit Kearsipan Kementerian/Lembaga Negara"
            },
            {
                id: 41,
                question: "Berikut ini manfaat menggunakan standar elemen data arsip Dinamis dan Statis untuk Penyelenggaraan Sistem Informasi Kearsipan Nasional (SIKN), kecuali ....",
                answerText: "C: memungkinkan penggunaan data tunggal"
            },
            {
                id: 42,
                question: "Kegiatan pengolahan dan penyajian arsip menjadi informasi pada unit pengolah/satuan kerja, dilakukan terhadap ....",
                answerText: "B: arsip aktif dan arsip vital"
            },
            {
                id: 43,
                question: "Peraturan tentang Sistem Pemerintahan Berbasis Elektronik (SPBE), adalah ....",
                answerText: "D: Peraturan Presiden Nomor 95 Tahun 2018"
            },
            {
                id: 44,
                question: "Berikut ini persyaratan menjadi simpul jaringan, kecuali ....",
                answerText: "B: memiliki daftar isi berkas"
            },
            {
                id: 45,
                question: "Berikut ini manfaat menggunakan standar elemen data arsip Dinamis dan Statis untuk Penyelenggaraan Sistem Informasi Kearsipan Nasional (SIKN), kecuali ....",
                answerText: "C: memungkinkan penggunaan data tunggal."
            }
        ];

        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const initialState = document.getElementById('initialState');
        const emptyState = document.getElementById('emptyState');

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function handleSearch(query) {
            const trimmedQuery = query.toLowerCase().trim();
            const keywords = trimmedQuery.split(/\s+/).filter(Boolean);

            if (keywords.length === 0) {
                initialState.classList.remove('hidden');
                emptyState.classList.add('hidden');
                resultsContainer.innerHTML = '';
                clearBtn.classList.add('hidden');
                return;
            }

            initialState.classList.add('hidden');
            clearBtn.classList.remove('hidden');

            const filtered = qaData.filter(item => {
                const qText = item.question.toLowerCase();
                return keywords.every(kw => qText.includes(kw));
            }).slice(0, 2); // Limit to top 1-2 results for ultra-clean mobile priority

            if (filtered.length === 0) {
                resultsContainer.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            resultsContainer.innerHTML = filtered.map(item => `
                <div class="bg-white rounded-xl p-3.5 border border-slate-200 shadow-sm">
                    <p class="text-[10px] font-semibold text-indigo-600 mb-1 uppercase tracking-wider">Soal Ujian</p>
                    <h2 class="text-xs sm:text-sm font-medium text-slate-800 mb-2.5 leading-snug">
                        ${escapeHtml(item.question)}
                    </h2>
                    <div class="bg-emerald-50 border border-emerald-200 rounded-lg p-2.5 flex items-center">
                        <svg class="h-4 w-4 text-emerald-600 mr-2 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                        <div class="overflow-hidden">
                            <span class="text-[9px] text-emerald-700 block font-semibold uppercase tracking-wider">Jawaban Benar:</span>
                            <span class="text-emerald-900 font-bold text-xs sm:text-sm block">${escapeHtml(item.answerText)}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        searchInput.addEventListener('input', (e) => {
            handleSearch(e.target.value);
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            handleSearch('');
            searchInput.focus();
        });
    </script>
</body>
</html>
